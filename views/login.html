<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบ · Log Monitor</title>
  <style>
    :root { --bg:#0f141a; --card:#171e26; --line:#273240; --text:#e6edf3; --muted:#8b98a8; --accent:#3b82f6; --danger:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
    form { width: min(360px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
    h1 { margin:0 0 4px; font-size:20px; }
    p.sub { margin:0 0 22px; color:var(--muted); font-size:13px; }
    label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f141a; color:var(--text); font-size:14px; }
    input:focus { outline:2px solid var(--accent); border-color:transparent; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    .err { display:none; margin-top:14px; padding:10px 12px; border-radius:8px; background:rgba(248,113,113,.12); color:var(--danger); font-size:13px; }
  </style>
</head>
<body>
  <form method="post" action="/monitor/login" autocomplete="on">
    <h1>Log Monitor</h1>
    <p class="sub">Auto Update Server</p>
    <label for="username">ชื่อผู้ใช้</label>
    <input id="username" name="username" required autofocus autocomplete="username" />
    <label for="password">รหัสผ่าน</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />
    <button type="submit">เข้าสู่ระบบ</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const e = new URLSearchParams(location.search).get('error');
    const msg = { invalid: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', locked: 'ใส่รหัสผิดหลายครั้งเกินไป กรุณารอ 15 นาทีแล้วลองใหม่' }[e];
    if (msg) { const el = document.getElementById('err'); el.textContent = msg; el.style.display = 'block'; }
  </script>
</body>
</html>
